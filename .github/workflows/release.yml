name: release

# Runs when a version tag is pushed (packaging/bump.sh does that), or by hand from the Actions
# tab: then it only builds the files, without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # v0.2.0 → 0.2.0; a manual run uses the version in Cargo.toml
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 gtk4-layer-shell
      - uses: actions/checkout@v4
      - name: version
        run: |
          git config --global --add safe.directory "$PWD"
          echo "VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: arch package
        run: |
          useradd -m builder
          mkdir /tmp/pkg dist
          cp packaging/arch/PKGBUILD /tmp/pkg/
          git archive --format=tar.gz --prefix="zunder-$VER/" HEAD > "/tmp/pkg/zunder-$VER.tar.gz"
          sed -i "s/^pkgver=.*/pkgver=$VER/; s/^sha256sums=.*/sha256sums=('SKIP')/" /tmp/pkg/PKGBUILD
          chown -R builder /tmp/pkg
          # build deps are installed; runtime deps (hyprland, wl-clipboard) are not needed to build
          su builder -c "cd /tmp/pkg && makepkg -f --noconfirm --nodeps"
          cp /tmp/pkg/zunder-$VER-*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*

  # The generic tarball is built on Debian 13: its glibc (2.41) is old enough for Debian,
  # Ubuntu 25.04+, Fedora 42+, openSUSE and Arch, and it packages gtk4-layer-shell.
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates build-essential pkg-config git libgtk-4-dev libgtk4-layer-shell-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: version
        run: echo "VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: tarball
        run: |
          cargo build --release --locked
          mkdir -p dist "stage/zunder-$VER"
          cp target/release/zunder install.sh README.md LICENSE "stage/zunder-$VER/"
          cp -r docs examples "stage/zunder-$VER/"
          tar -C stage -czf "dist/zunder-$VER-x86_64-linux.tar.gz" "zunder-$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    env:
      # one cargo home for MSYS2's cargo and rust-cache, so the registry gets cached too
      CARGO_HOME: D:\cargo-home
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            zip
            unzip
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msys2
          cache-directories: target-console
      - name: version
        run: echo "VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: build
        run: |
          cargo build --release --locked
          cargo build --release --locked --features console --target-dir target-console
      - name: bundle GTK next to zunder.exe
        run: |
          app="zunder-$VER"
          mkdir -p "$app/bin" "$app/lib" "$app/share/glib-2.0/schemas" "$app/share/icons"
          cp target/release/zunder.exe "$app/bin/"
          # fd for file search, so nothing has to be installed after zunder
          curl -fsSL -o fd.zip https://github.com/sharkdp/fd/releases/download/v10.3.0/fd-v10.3.0-x86_64-pc-windows-msvc.zip
          unzip -j -q fd.zip "*/fd.exe" -d "$app/bin/"
          cp target-console/release/zunder.exe "$app/bin/zunder-console.exe"
          # every DLL zunder.exe needs from MSYS2, found recursively by ldd
          ldd "$app/bin/zunder.exe" | grep -i '/ucrt64/' | awk '{print $3}' | sort -u | xargs -I{} cp {} "$app/bin/"
          cp -r /ucrt64/lib/gdk-pixbuf-2.0 "$app/lib/"
          # only the image loaders zunder uses (png, jpeg, gif, svg for GTK's own icons)
          loaders="$app/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          rm -f "$loaders"/*.dll.a "$loaders"/*xpm* "$loaders"/*xbm* "$loaders"/*tga* "$loaders"/*tiff* "$loaders"/*ani* "$loaders"/*bmp* "$loaders"/*icns* "$loaders"/*qtif*
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled "$app/share/glib-2.0/schemas/"
          cp -r /ucrt64/share/icons/Adwaita /ucrt64/share/icons/hicolor "$app/share/icons/"
          # Windows draws its own cursors; GTK's controls only need a few symbolic icons
          adw="$app/share/icons/Adwaita"
          rm -rf "$adw/cursors" "$adw/symbolic/status" "$adw/symbolic/devices" "$adw/symbolic/emotes" "$adw/symbolic/legacy" "$adw/symbolic/apps" "$adw/symbolic/categories"
          gtk4-update-icon-cache -q -t -f "$adw" || true
          # the Nerd Font zunder's glyphs need; zunder installs it for the user on first start
          mkdir -p "$app/share/fonts"
          curl -fsSL -o nf.tar.xz https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/JetBrainsMono.tar.xz
          tar -xJf nf.tar.xz -C "$app/share/fonts" JetBrainsMonoNerdFont-Regular.ttf
          cp README.md LICENSE "$app/"
          cp -r docs examples "$app/"
          printf '@start "" "%%~dp0bin\\zunder.exe" %%*\r\n' > "$app/zunder.cmd"
          # same program with a console that shows every error, for when zunder.cmd does nothing
          printf '@echo off\r\necho zunder debug run, errors show up below. Close this window to stop.\r\n"%%~dp0bin\\zunder-console.exe"\r\necho exit code %%errorlevel%%\r\npause\r\n' > "$app/zunder-debug.cmd"
          mkdir -p dist
          zip -qr "dist/zunder-$VER-windows-x86_64.zip" "$app"
          du -sh "$app" "dist/zunder-$VER-windows-x86_64.zip"
      - name: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DZunderVersion=$env:VER" "/DSrc=$PWD\zunder-$env:VER" "/DOut=$PWD\dist" packaging\windows\zunder.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, @{n='MB'; e={[math]::Round($_.Length / 1MB, 1)}}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install gtk4 pkgconf dylibbundler adwaita-icon-theme
      - uses: Swatinem/rust-cache@v2
      - name: version
        run: echo "VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release --locked
      - name: zunder.app
        run: |
          app=dist/zunder.app/Contents
          res="$app/Resources"
          mkdir -p "$app/MacOS" "$app/Frameworks" "$res/share/glib-2.0/schemas" "$res/share/icons" "$res/share/fonts"
          cp target/release/zunder "$app/MacOS/zunder-bin"
          cp packaging/macos/launcher.sh "$app/MacOS/zunder"
          chmod +x "$app/MacOS/zunder"
          sed "s/@VERSION@/$VER/" packaging/macos/Info.plist > "$app/Info.plist"
          prefix=$(brew --prefix)
          # every Homebrew dylib the binary needs goes into Frameworks. -s resolves @rpath
          # references; `yes quit` makes it abort instead of asking for a folder forever
          bundle() { dylibbundler -b -x "$1" -d "$app/Frameworks" -p @executable_path/../Frameworks/ -s "$prefix/lib" "${@:2}" < <(yes quit); }
          bundle "$app/MacOS/zunder-bin" -od
          cp "$prefix/share/glib-2.0/schemas/gschemas.compiled" "$res/share/glib-2.0/schemas/"
          cp -r "$prefix/share/icons/Adwaita" "$prefix/share/icons/hicolor" "$res/share/icons/"
          rm -rf "$res/share/icons/Adwaita/cursors"
          # image loaders: their dylibs into Frameworks too, and a cache with paths inside the app
          # (the launcher fills in where the app actually is)
          loaders="$res/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          mkdir -p "$loaders"
          cp "$prefix"/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.so "$loaders/"
          for f in "$loaders"/*.so; do
            bundle "$f" -of
          done
          GDK_PIXBUF_MODULEDIR="$loaders" gdk-pixbuf-query-loaders \
            | sed "s|$PWD/$res|@RES@|g" > "$res/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache.in"
          # the Nerd Font for the glyphs; zunder loads it from Resources/share/fonts
          curl -fsSL -o nf.tar.xz https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/JetBrainsMono.tar.xz
          tar -xJf nf.tar.xz -C "$res/share/fonts" JetBrainsMonoNerdFont-Regular.ttf
      - name: sign and check
        run: |
          app=dist/zunder.app/Contents
          # dylibbundler rewrote the binaries, which breaks their signatures; Apple Silicon refuses
          # to run that ("damaged"). Ad-hoc sign everything inside, then the app.
          find "$app/Frameworks" "$app/Resources/lib" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - {} \;
          codesign --force --sign - "$app/MacOS/zunder-bin"
          codesign --force --sign - dist/zunder.app
          codesign --verify --deep --strict --verbose=2 dist/zunder.app
          # nothing may still point into Homebrew, or it breaks on Macs without it
          if otool -L "$app/MacOS/zunder-bin" "$app"/Frameworks/*.dylib "$app"/Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.so \
              | grep -E "^\s+(/opt/homebrew|/usr/local/(opt|Cellar|lib))"; then
            echo "Homebrew paths left in the bundle"; exit 1
          fi
          # dyld loads every linked library at start: this fails if one is missing
          dist/zunder.app/Contents/MacOS/zunder --version
      - name: dmg
        run: |
          mkdir -p out
          hdiutil create -volname zunder -srcfolder dist/zunder.app -ov -format UDZO "out/zunder-$VER-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  publish:
    if: github.ref_type == 'tag'
    needs: [arch, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checked by get.sh before installing
          (cd files && sha256sum * > SHA256SUMS)
          gh release create "$TAG" files/* --title "zunder ${TAG#v}" --generate-notes \
            --notes "Arch: \`sudo pacman -U\` the .pkg.tar.zst · Linux: the tarball and install.sh · Windows: run zunder-windows-setup.exe (no admin; More info → Run anyway), then ALT+SPACE · macOS (Apple Silicon): open the .dmg, drag zunder to Applications, right-click → Open the first time (it isn't signed). macOS and Windows don't have the window switcher yet."
