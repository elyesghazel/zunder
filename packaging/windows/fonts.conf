<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig setup for the Windows bundle: zunder sets FONTCONFIG_FILE to this file -->
<fontconfig>
  <!-- the Nerd Font shipped with zunder, then the Windows font folders for everything else -->
  <dir prefix="relative">../../share/fonts</dir>
  <dir>WINDOWSFONTDIR</dir>
  <dir>WINDOWSUSERFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>

  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Segoe UI</family><family>Segoe UI Emoji</family></prefer>
  </alias>
</fontconfig>
