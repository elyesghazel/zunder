[package]
name = "zunder"
version = "0.1.0"
edition = "2024"
description = "Terminal-styled launcher and ALT+TAB window switcher for Hyprland"
license = "MIT"
repository = "https://github.com/elyesghazel/zunder"
readme = "README.md"
keywords = ["launcher", "hyprland", "wayland", "gtk4", "switcher"]
categories = ["command-line-utilities", "gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
async-channel = "2.5.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dirs = "7.0.0"
emojis = "0.9.1"
fuzzy-matcher = "0.3.7"
gtk4 = { version = "0.11.5", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
meval = "0.2.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
