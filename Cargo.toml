[package]
name = "zunder"
version = "0.3.6"
edition = "2024"
description = "Terminal-styled launcher and ALT+TAB window switcher for Hyprland"
license = "MIT"
repository = "https://github.com/elyesghazel/zunder"
readme = "README.md"
keywords = ["launcher", "hyprland", "wayland", "gtk4", "switcher"]
categories = ["command-line-utilities", "gui"]

# quick optimized builds for trying changes on another machine: release without the slow LTO
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
# Windows: keep the console window, to see errors (zunder-debug.cmd in the release zip)
console = []

[dependencies]
async-channel = "2.5.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dirs = "7.0.0"
emojis = "0.9.1"
fuzzy-matcher = "0.3.7"
gtk4 = { version = "0.11.5", features = ["v4_14"] }
iana-time-zone = "0.1.65"
meval = "0.2.0"
pango = { version = "0.22", features = ["v1_56"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4-layer-shell = "0.8.1"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
gdk4-macos = "0.11.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSScreen", "NSResponder", "NSGraphics", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPasteboard", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSData", "NSString", "NSArray", "NSDictionary"] }

[target."cfg(windows)".dependencies]
gdk4-win32 = "0.11.5"
lnk = "0.6.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[build-dependencies]
embed-resource = "3.0.12"
